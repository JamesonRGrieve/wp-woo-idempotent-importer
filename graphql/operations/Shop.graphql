query Shop {
  shop {
    id
    name
    email
    contactEmail
    currencyCode
    weightUnit
    ianaTimezone
    taxesIncluded
    orderNumberFormatPrefix
    orderNumberFormatSuffix
    myshopifyDomain
    primaryDomain {
      host
      url
    }
    shopAddress {
      address1
      address2
      city
      province
      provinceCode
      countryCodeV2
      zip
      phone
    }
  }
}
